name: CI

on:
  pull_request:
  push:
    # claude/** = branches the Mimoia HQ agents prepare (Producto, L2): every
    # code approval reaches /ona-dia with its CI result. Production smoke
    # stays master-only (see post-deploy-smoke).
    branches: [master, 'claude/**']

# Cancel in-progress runs of the same workflow on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  # ─── Lint + type-check + unit tests ───────────────────────────────
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package (required by api/web typecheck)
        run: pnpm --filter @ona/shared build

      - name: Schema drift check (schema.ts vs committed migrations)
        # `drizzle-kit generate` must report "No schema changes"; the script
        # removes anything it generated and fails otherwise. No DB needed.
        run: bash apps/api/scripts/check-schema-drift.sh

      - name: Type-check API
        run: pnpm --filter @ona/api lint

      - name: Type-check Web
        # apps/web has no `lint` script yet; tsc is the gate.
        run: pnpm --filter @ona/web exec tsc --noEmit

      - name: API unit tests
        run: pnpm --filter @ona/api test
        env:
          # usdaClient.smoke.ts reads USDA_FDC_API_KEY (same name as env.ts);
          # without the repo secret those tests skip.
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}

  # ─── Route smoke tests against a real Postgres + booted API ───────
  # Boots Postgres as a service container, applies the real migrations
  # (same `db:migrate` production runs on deploy), seeds the catalog,
  # starts the API in the background, registers a throwaway user to
  # mint a token, then runs every `*.smoke.ts` file with that token and
  # fails if any of them skipped unexpectedly.
  smoke:
    name: Route smoke (Postgres + API)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onatest
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onatest
      JWT_SECRET: ci-smoke-only-not-used-anywhere-else
      # Closed beta (PRO-27): smoke registers users freely.
      REGISTRATION_MODE: open
      # Smoke files register throwaway users from localhost; keep them clear
      # of the per-IP auth limiter (ignored by a deployed API: NODE_ENV=production
      # or Railway).
      RATE_LIMIT_DISABLED: 'true'
      # Read-only token for GET /admin/metrics + /admin/waitlist + /admin/errors,
      # so waitlistRoute.smoke.ts checks the admin aggregates against real SQL.
      METRICS_READ_TOKEN: ci-smoke-metrics-token
      API_PORT: 8765
      API_URL: http://localhost:8765

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ona/shared build

      - name: Apply migrations to test DB
        # Production runs `db:migrate` (RAILPACK_START_CMD), not `drizzle-kit
        # push`. Using the real migrations here means broken migration SQL —
        # and the hand-written indexes/constraints schema.ts doesn't declare —
        # behave in CI exactly as they will in prod.
        run: pnpm --filter @ona/api db:migrate

      - name: Seed catalog
        # Menus/shopping smokes need recipes to generate a real menu.
        run: pnpm --filter @ona/api db:seed

      - name: Boot API in background
        run: |
          set -e
          pnpm --filter @ona/api exec tsx src/index.ts > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health" >/dev/null 2>&1; then
              echo "API healthy."
              exit 0
            fi
            sleep 1
          done
          echo "API never responded on /health. Last log:"
          tail -50 /tmp/api.log
          exit 1

      - name: Register smoke user
        id: register
        run: |
          set -e
          TS=$(date +%s)
          REG=$(curl -fsS -X POST "$API_URL/register" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"smoke_${TS}\",\"email\":\"smoke_${TS}@test.local\",\"password\":\"smokepass123\",\"ageConfirmed\":true}")
          TOKEN=$(printf '%s' "$REG" | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{process.stdout.write(JSON.parse(b).token||"")})')
          # NB: cannot use $UID — that name is a readonly bash builtin (the
          # process owner's numeric UID). Use SMOKE_USERID instead.
          SMOKE_USERID=$(printf '%s' "$REG" | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{process.stdout.write(JSON.parse(b).user?.id||"")})')
          if [ -z "$TOKEN" ] || [ -z "$SMOKE_USERID" ]; then
            echo "Register failed. Response: $REG"
            exit 1
          fi
          # Stash for next step (no values in logs).
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "uid=$SMOKE_USERID" >> "$GITHUB_OUTPUT"

      - name: Run smoke vitest suite
        env:
          SMOKE_USER_TOKEN: ${{ steps.register.outputs.token }}
          SMOKE_USER_ID: ${{ steps.register.outputs.uid }}
          # Missing API / token / user id → hard failure, not a silent skip
          # (see apps/api/src/tests/smokeEnv.ts).
          SMOKE_REQUIRED: 'true'
        # `.smoke.ts` matches every smoke file, so new ones run automatically.
        # Sequential: menus + shopping share the smoke user's week.
        run: |
          pnpm --filter @ona/api exec vitest run .smoke.ts \
            --no-file-parallelism \
            --reporter=default --reporter=json --outputFile.json=/tmp/smoke-report.json

      - name: Assert no smoke test was skipped unexpectedly
        # Allowed: smokes gated on external API keys this job doesn't get.
        # TODO: add ANTHROPIC_API_KEY to un-skip extractorAbstractUnits.
        run: |
          node apps/api/scripts/assert-smoke-ran.mjs /tmp/smoke-report.json \
            --allow-skip extractorAbstractUnits.smoke.ts \
            --allow-skip usdaClient.smoke.ts

      - name: Tail API log on failure
        if: failure()
        run: tail -100 /tmp/api.log || true

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          fi

  # ─── End-to-end browser flows (Playwright + booted API + booted Web) ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onatest
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onatest
      JWT_SECRET: ci-e2e-only-not-used-anywhere-else
      # Closed beta stays ON here (PRO-27): Playwright's globalSetup registers
      # this admin (always allowed) and creates the "e2e" campaign link every
      # spec signs up with; closed-beta.spec.ts checks the rejection.
      ADMIN_EMAILS: e2e-admin@test.local
      # Every Playwright spec registers a fresh user from localhost; the API's
      # 10-registrations/hour/IP limiter would fail the suite from the 11th
      # test on. Ignored by a deployed API (NODE_ENV=production or Railway).
      RATE_LIMIT_DISABLED: 'true'
      API_PORT: 8765
      API_URL: http://localhost:8765
      WEB_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:8765

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ona/shared build

      - name: Apply migrations
        run: pnpm --filter @ona/api db:migrate

      - name: Seed catalog
        # Required: the catalog/cook-log/recipe-create specs need recipes and
        # the "ajo" ingredient. A failing seed must fail the job, not turn
        # those specs into silent skips.
        run: pnpm --filter @ona/api db:seed

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @ona/web exec playwright install --with-deps chromium

      - name: Boot API
        run: |
          pnpm --filter @ona/api exec tsx src/index.ts > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health" >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          tail -50 /tmp/api.log; exit 1

      - name: Boot Web
        run: |
          PORT=3001 pnpm --filter @ona/web exec next dev --port 3001 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          for i in $(seq 1 90); do
            if curl -fsS "$WEB_URL/" >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          tail -80 /tmp/web.log; exit 1

      - name: Pre-compile routes
        # `next dev` compiles each route on first hit; doing it here keeps
        # that (cold-runner) cost out of the specs' 30 s timeouts.
        run: bash apps/web/scripts/warm-routes.sh "$WEB_URL"

      - name: Run Playwright
        run: pnpm --filter @ona/web exec playwright test

      - name: Tail logs on failure
        if: failure()
        run: |
          echo '── api.log ─────────────────────────'
          tail -200 /tmp/api.log || true
          echo '── web.log ─────────────────────────'
          tail -200 /tmp/web.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Stop processes
        if: always()
        run: |
          for f in /tmp/api.pid /tmp/web.pid; do
            [ -f "$f" ] && kill "$(cat $f)" 2>/dev/null || true
          done

  # ─── Production liveness smoke (master only) ──────────────────────
  # Read-only checks against the live Railway services: GETs plus one
  # POST /login with bogus credentials (rejected; nothing is written).
  #
  # Deploys are manual (scripts/deploy.sh → `railway up`); there is no
  # GitHub→Railway hook, so this job does NOT prove the pushed commit is
  # what's running. It proves prod is up, the auth gate is live, and both
  # services answer — a canary, not a deploy verification.
  post-deploy-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    needs: [test, smoke, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 5

    env:
      API_URL: https://ona-api-production.up.railway.app
      WEB_URL: https://ona-web-production.up.railway.app

    steps:
      - uses: actions/checkout@v4
      # Same checks the nightly Taller runs against staging and production
      # (docs/deploy.md → Staging). Retries absorb a cold start.
      - name: Production smoke (scripts/smoke-remote.sh)
        run: scripts/smoke-remote.sh "$API_URL" "$WEB_URL"
